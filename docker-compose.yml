services:
  mongodb:
    container_name: mongodb
    image: mongo

  webstrates:
    container_name: webstrates
    build: .
    volumes:
      - ./uploads:/app/uploads
      - ./config.json:/app/config.json
      - ./keys:/app/keys
    environment:
      - WEBSTRATES_DB=mongodb://mongodb:27017/webstrate
      - WEBSTRATES_COOKIE_KEY_FILE=/app/keys/cookie.key
    ports:
      - 7007:7007
