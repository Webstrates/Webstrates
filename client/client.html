<!doctype html>
<html>
<body>
<div class="spinner"></div>
<style type="text/css" media="screen">
  body {
    display: grid;
    place-items: center;
    height: 100vh;
  }
  .spinner {
    position: relative;
    width: 10vw;
    height: 10vh;
    aspect-ratio: 1;
    background: url("/favicon.ico") no-repeat center / contain;
  }
  .spinner::before,
  .spinner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: inherit;
    animation: emit 2.4s ease-out infinite;
    z-index: -1;
  }
  .spinner::after {
    animation-delay: 1.2s;
  }
  @keyframes emit {
    from { transform: scale(1); opacity: .4; }
    to   { transform: scale(1.7); opacity: 0; }
  }
</style>
<script src="/webstrates.js?{{hash}}"></script>
</body></html>
